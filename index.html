<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de apagar incendio</title>
    <script src="juego.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="body">
    <section id="jugador">
        <div id="vida">
            <p>Vida:</p>
            <span id="barra_de_vida" class="barra3"></span>
        </div>
        <div id="quemados">
            <p>Quemados:</p>
            <span id="cuadrado_quemados">0</span>
        </div>
        <div id="restantes">
            <p>Restantes:</p>
            <span id="cuadrado_restantes">0</span>
        </div>
    </section>
    <main id="principal"></main>
    <section id="inventario">
        <div id="hueco1" class="slot">
            <span class="numero">1</span>
            <img class="foto"></img>
        </div>
        <div id="hueco2" class="slot">
            <span class="numero">2</span>
            <img class="foto"></img>
        </div>
        <div id="hueco3" class="slot">
            <span class="numero">3</span>
            <img class="foto"></img>
        </div>
        <div id="hueco4" class="slot">
            <span class="numero">4</span>
            <img class="foto"></img>
        </div>
        <div id="hueco5" class="slot">
            <span class="numero">5</span>
            <img class="foto"></img>
        </div>
    </section>
    <div id="div_tiempo">
        <p>Tiempo: </p>
        <p id="tiempo"></p>
    </div>
    <div id="enemigos_derrotados">
        <img src="img/muerte.png" id="icono_muertes"></img>
        <p id="numero_enemigos"></p>
    </div>
    <script>

        //CONSTANTES GLOBALES
        const TEXTO = "*";
        const PROTA = "0";
        const ENEMIGO = "9";
        const FUEGO = "x";
        const PISTOLA = "1";
        const VENDAS = "2";
        const PLASM_CANON = "3";
        const GRANADA = "4";

        const PLASM_BULLET = "O";
        const TAMAÑO = 20;
        const MITAD = Math.floor(TAMAÑO / 2);
        const MITAD_TOTAL = Math.floor(TAMAÑO * TAMAÑO / 2  )
        const UN_CUARTO = Math.floor(TAMAÑO * TAMAÑO / 4);
        const TRES_CUARTOS = Math.floor((TAMAÑO * TAMAÑO * 3) / 4);
        const MAYORIA = Math.floor(TAMAÑO * TAMAÑO * 0.85);
        var pos_fuego_inicio;

        //CONSTANTES HTML
        const MAIN = document.getElementById("principal");
        const CASILLAS_QUEMADAS = document.getElementById("cuadrado_quemados");
        const CASILLAS_RESTANTES = document.getElementById("cuadrado_restantes")
        const FOTOS_INVENTARIO = document.getElementsByClassName("foto");
        const SLOTS_INVENTARIO = document.getElementsByClassName("slot");
        const BARRA_DE_VIDA = document.getElementById("barra_de_vida");
        const TIEMPO = document.getElementById("tiempo");
        const ENEMIGOS = document.getElementById("numero_enemigos");

        //VARIABLES PRINCIPALES
        const ELEMENTOS = construir_tablero();
        const TABLERO = ELEMENTOS[0];
        MAIN.appendChild(TABLERO);
        var partida = ELEMENTOS[1]; 
        const CASILLAS = document.getElementsByClassName("casilla");
        var protagonista;
        var texto_pisado = TEXTO;
        var casillas_quemadas = 0;
        var casillas_restantes = TAMAÑO * TAMAÑO;
        var objetos = {
            'pistola': '../img/pistola.avif',
            'vendas': '../img/venda.jpeg',
            'plasm_canon': '../img/plasm_canon.png',
            'granada': '../img/granada.png'
        }
        var inventario = {};
        var equipado = "";
        var vida = 3;
        var tiempo_de_juego = 0;
        var velocidad_fuego = 5000;
        var velocidad_spawn_fuego = 2;

        var id_enemigo = 1;
        var velocidad_enemigo = 5000;
        var ratio_spawneo = 1000;
        var enemigos_derrotados = 0;
        var spawnear_enemigos = true;

        const VELOCIDAD_BALA = 25;
        const COOLDOWN_CLICK = 0;
        var ultimo_click = 0;
        var id_bala = 1;

        var velocidad_plasm_bullet = 200;

        var direccion = 'norte';

        const DROP_PLASM_CANON = 5;
        const DROP_VENDAS = 20;
        const DROP_GRANADA = 80;

        //FUNCIONES PARA EL INICIO DE LA PARTIDA
        const CONTENEDOR = document.getElementById("contenedor_principal");
        CONTENEDOR.style.gridTemplateColumns = `repeat(${TAMAÑO}, minmax(0, 1fr))`;
        CONTENEDOR.style.gridTemplateRows = `repeat(${TAMAÑO}, minmax(0, 1fr))`;
        TIEMPO.textContent = 0;
        ENEMIGOS.textContent = enemigos_derrotados;
        CASILLAS_RESTANTES.textContent = casillas_restantes;
        cargar();
        insertar_jugador();
        player_array = MITAD;
        player_position = MITAD;
        insertar_pistola();
        cargar();
        protagonista = document.getElementById("protagonista");
        verdireccion();
        avanzar_tiempo();


    </script>
</body>
</html>
